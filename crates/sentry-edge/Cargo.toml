[package]
name = "sentry-edge"
description = "Inline edge (WAF/reverse proxy + middleware + TCP listener) for Sentry (F3.1/F3.9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# TLS termination for the inline HTTPS listener (tokio-rustls + rustls/ring),
# with ClientHello telemetry (SNI / JA3 / JA4).
edge-tls = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower-service",
    "dep:x509-parser",
]

[dependencies]
sentry-core = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
prometheus = { workspace = true }
sha2 = { workspace = true }
# JA3 fingerprints are defined as MD5 (hash choice is part of the spec).
md-5 = "0.10"
hex = "0.4"
uuid = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, features = ["server-auto", "service"], optional = true }
tower-service = { version = "0.3", optional = true }
x509-parser = { version = "0.16", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = { workspace = true }
rustls-pki-types = "1"
rcgen = "0.13"
