[package]
name = "sentry-edge"
description = "Inline edge (WAF/reverse proxy + middleware + TCP listener) for Sentry (F3.1/F3.9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# TLS termination for the inline HTTPS listener (tokio-rustls + rustls/ring),
# with ClientHello telemetry (SNI / JA3 / JA4). Carries hyper's h2 so the
# ALPN-negotiated HTTP/2 works on the same router (F12).
edge-tls = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:x509-parser",
    "hyper/http2",
    "hyper-util/http2",
]
# zstd response compression (F12): opt-in because zstd-sys compiles C.
edge-zstd = ["dep:zstd"]

[dependencies]
sentry-core = { workspace = true }
sentry-protocol = { workspace = true }
regex = { workspace = true }
ipnet = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
prometheus = { workspace = true }
sha2 = { workspace = true }
# JA3 fingerprints are defined as MD5 (hash choice is part of the spec).
md-5 = "0.10"
hex = "0.4"
uuid = { workspace = true }
# Response compression (F12): buffered bodies are re-encoded in place;
# per-algorithm levels come from `[edge.compress]`.
brotli = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true, optional = true }
# hyper/hyper-util (non-optional since F14): the TLS listener and the raw h1
# WebSocket-upgrade hop share them; reqwest already pulls both crates in.
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "service"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
tower-service = { version = "0.3" }
# Listener socket options (F14): SO_REUSEPORT, backlog, TCP flags.
socket2 = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
x509-parser = { version = "0.16", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = { workspace = true }
rustls-pki-types = "1"
rcgen = "0.13"
# HTTP/2 integration test (F12): a real h2 client against the TLS listener.
h2 = "0.4"
