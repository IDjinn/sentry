# sentry.conf — aaPanel production config (SHADOW mode, log-only).
#
# Copy this to /etc/sentry/sentry.conf (or config/sentry.conf) on the server
# and edit. All rule packs start in shadow mode: Sentry detects and logs but
# never blocks. Promote to enforce only after confirming no false positives.
#
# Secrets via env (never here): SENTRY_CF_TOKEN, SENTRY_CF_ZONE, SENTRY_LLM_KEY,
# SENTRY_STORAGE__POSTGRES__URL.

server {
    data_directory: /var/lib/sentry
    channel_buffer: 8192
}

storage {
    url: "${SENTRY_DATABASE_URL:-postgres://sentry:changeme@localhost:5432/sentry}"
    max_connections: 10
}

# LLM (optional, disabled by default).
detect {
    llm {
        provider: none
        only_above: 30
        concurrency: 4
        cache_ttl: 5m
    }
}

# Rules engine — everything in SHADOW for initial testing.
rules {
    packs {
        vpn_proxy: shadow
        tor: shadow
        crawlers_bad: shadow
        crawlers_good: shadow
        sensitive_paths: shadow
        empty_ua: shadow
        http_anomaly: shadow
        rate_scan: shadow
    }

    pack country_blocklist {
        mode: off
        # countries: [RU, CN]
    }

    # Internal monitoring / health checks — silent: rsyslog + VPC infra
    # traffic is expected noise; still stored, just not printed per event.
    rule "allow localhost" {
        priority: 1
        match: 'ip=127.0.0.0/8'
        action: allow
        log: silent
    }
    rule "allow private networks" {
        priority: 2
        match: 'ip=10.0.0.0/8 OR ip=172.16.0.0/12 OR ip=192.168.0.0/16'
        action: allow
        log: silent
    }
}

# Sources — aaPanel nginx logs (combined format is the nginx default).
source nginx {
    path: /var/log/nginx/elexapk.com.log
    format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
}

source nginx {
    path: /var/log/nginx/cok-chat.elexapk.com.log
    format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
}

# Actions — start with log only, add blocklist/cloudflare later.
action blocklist {
    ttl: 24h
}

action log {}
