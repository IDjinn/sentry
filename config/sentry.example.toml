# sentry.example.toml — example configuration for Sentry.
#
# Copy to `sentry.toml` and edit. Secrets go in env vars, not here.
# Env overlay (figment): SENTRY_<SECTION>__<KEY>=value
#   e.g. SENTRY_STORAGE__POSTGRES__URL=postgres://sentry:secret@db/sentry

[core]
data_dir = "/var/lib/sentry"
channel_buffer = 4096

# ── Storage ──────────────────────────────────────────────────────────────
[storage.postgres]
url = "postgres://sentry:changeme@localhost:5432/sentry"
max_connections = 10

# ── Geo / ASN enrichment ─────────────────────────────────────────────────
# Download GeoLite2 (free) from MaxMind and place the .mmdb files here.
# If the files are absent, geo enrichment is a graceful no-op.
[geo]
city_db = "/var/lib/sentry/GeoLite2-City.mmdb"
asn_db  = "/var/lib/sentry/GeoLite2-ASN.mmdb"

# ── Known routes (route validator) ────────────────────────────────────────
# Routes your app actually serves. Requests outside this set (or with
# disallowed methods) raise an `UnknownRoute` signal. Empty = all unknown.
# `path` accepts exact strings or globs like `/api/*`. Empty `methods` = any.
[[routes.known]]
path = "/"
methods = ["GET"]

[[routes.known]]
path = "/api/health"
methods = ["GET"]

[[routes.known]]
path = "/api/users/*"
methods = ["GET", "POST", "PATCH", "DELETE"]

[[routes.known]]
path = "/static/*"
methods = ["GET"]

# ── Scorer ─────────────────────────────────────────────────────────────────
# Override default weights for specific signal kinds (key = signal name).
# repetition_bonus adds score for repeated signals within the sliding window.
[scorer]
repetition_bonus = true
repetition_window_secs = 60
# [scorer.weights]
# sql_injection = 35
# xss = 30
# path_traversal = 25
# random_scan = 25            # RandomScan signal ([scan] distinct-path sweeps)
# scan_behavior = 35          # ScanBehavior signal ([scan] 404 counter)
# anomalous_payload = 25      # ONNX model signal ([ai])

# ── Verdict policy ─────────────────────────────────────────────────────────
# Override the verdict applied at each risk level. Useful to soften the
# default mapping (Medium → rate_limit, High → challenge, Critical → block)
# or to add `[[policy.override]]` DSL rules that force a specific verdict
# when a condition matches (evaluated before the level mapping).
[policy]
medium = "rate_limit"
high = "challenge"
critical = "block"

# Override rules: force a verdict when `match` DSL hits.
# match uses the same DSL as rules.custom (ip=, asn=, path=, method=, …).
# [[policy.override]]
# match = 'path ^/wp-admin$ AND NOT ip=10.0.0.0/8'
# verdict = "block"
# reason = "wp-admin only accessible from internal network"

# ── Repeat-offender escalation ─────────────────────────────────────────────
# Every event with a non-Allow verdict records 1 strike for the client IP.
# Strikes climb the verdict ladder (they only ever raise, never lower):
# challenge_at strikes → at least challenge, block_at strikes → block.
# Strikes decay window_secs after the last violation and are persisted to
# ip_state (Postgres), so memory survives restarts and outlives edge-rule
# TTLs — a returning offender is re-blocked on its first violating event.
[escalation]
enabled = true
window_secs = 604800        # 7 days (outlives the 24h edge-action TTL)
challenge_at = 3            # N strikes → escalate to challenge
block_at = 5                # N strikes → escalate to block
persist = true              # mirror strikes to ip_state + pre-warm on startup

# ── Behavioral scan detection ──────────────────────────────────────────────
# Per-IP sliding window counting only 4xx responses:
# ≥ distinct_paths distinct 4xx paths → RandomScan signal (weight 25, fires
# on every qualifying event — cumulative). Covers `/.env*` sweeps and
# random-filename probing (`/a1b2.php`, …) that no route template can match.
# ≥ not_found 4xx responses (same path or not) → ScanBehavior (weight 35).
[scan]
enabled = true
window_secs = 60
distinct_paths = 8
not_found = 10

# ── Behavioral attack detection ────────────────────────────────────────────
# Per-IP sliding window (5 min) over auth routes and probe paths:
# ≥ auth_failures 401/403 on login routes → AuthBruteForce (weight 35)
# ≥ distinct_uas distinct User-Agents failing auth → CredentialStuffing (40)
# ≥ wordlist_hits 404s on well-known paths → DirectoryBruteForce (30);
#   known-good crawlers (Googlebot, Bingbot, …) are exempt.
# ≥ suspicious_success_min_failures failures followed by a 2xx on a login
#   route → SuspiciousLoginSuccess (45): alert on the (maybe) successful
#   brute force, not on the failures. 0 disables it.
[behavior]
enabled = true
window_secs = 300
auth_failures = 10
distinct_uas = 3
wordlist_hits = 5
suspicious_success_min_failures = 3
# login_patterns = ["login", "signin", "auth"]   # empty = built-in list
# wordlist_paths = ["/admin", "/wp-admin"]       # empty = built-in wordlist

# ── Cross-IP scan→attack correlation (F3.10) ───────────────────────────────
# Honeypot "shot calling": a scan (404 sweep, masscan/zmap SYN, …) from IP A
# followed within window_secs by an exploit/brute-force from a *different*
# IP B in the same /24 (IPv4), /64 (IPv6) or ASN → ScanAttackCorrelation
# signal on B (weight 20, override via [scorer.weights]
# scan_attack_correlation). Works across sources: SYN scans captured by the
# tcp source feed the same window as HTTP 404 sweeps.
[correlation]
enabled = true
window_secs = 900           # 15 min

# ── rDNS bot verification (F7.10) ─────────────────────────────────────────
# UAs claiming to be a verifiable crawler (Googlebot, bingbot, Slurp,
# Baiduspider, YandexBot) are validated the way the engines recommend:
# reverse DNS must land on the engine's domains AND forward-resolve back to
# the client IP. Verified bots bypass the edge JS challenge; spoofed claims
# earn the SpoofedBot signal (weight 35 — override via
# [scorer.weights] spoofed_bot). DNS runs off the hot path (cache TTL per
# IP); a resolver outage never flags a genuine bot.
# With this enabled, the crawlers_good pack (enforce) requires a verified
# result for the engines it can verify (DSL: bot_verified = "true"|"false"|
# "google"|...). Inspect one IP: `sentry bots check <ip> --ua "Googlebot/2.1"`.
[bot_verification]
enabled = false
cache_ttl_secs = 3600       # verified result TTL per IP
failed_ttl_secs = 600       # spoofed result TTL (short: bots recover)
timeout_ms = 2000           # per-verification DNS round timeout
batch_size = 16             # max queued claims verified per drain cycle

# ── Local ML threat model (classic ML, ONNX fork) ──────────────────────────
# Runs beside the hot path: mode = "fork" (default) evaluates asynchronously
# and feeds signals back via rescore_from (can only raise the score),
# "inline" blocks before actions, "shadow" logs without acting.
# Requires building sentry-cli with --features onnx.
# Train: `sentry model export [--synthetic]` then tools/train_model.py.
[ai]
enabled = false
model_path = "models/anomaly_v1.onnx"
threshold = 0.7             # anomaly probability that emits a signal
signal_weight = 25          # weight of the AnomalousPayload signal
mode = "fork"               # fork | inline | shadow
trigger = "above_score"     # above_score | always | quarantine_only
min_score = 20              # hot-path score gate for above_score
concurrency = 4             # max parallel inferences (fork mode)
cache_ttl_secs = 300        # result cache keyed by payload hash

# ── Rate-limit backend ────────────────────────────────────────────────────
# Backend for `RuleMatch::Rate` conditions. `memory` is single-node
# (in-process sliding window); `redis` shares counters across nodes
# (requires `--features rate-redis` on sentry-cli).
[rate_limit]
backend = "memory"
# backend = "redis"
# redis_url = "redis://127.0.0.1/"

# ── Metrics (Prometheus) + event log for Grafana ──────────────────────────
# /metrics — Prometheus aggregates (also scraped by the bundled Grafana
#   dashboard, deploy/grafana/).
# /api/events — recent events as JSON (limit/level/verdict query params)
#   for dashboard table panels. Unauthenticated like /metrics: keep the
#   port internal. Disable with enabled=false.
[metrics]
enabled = true
host = "0.0.0.0"
port = 9100

# ── Route learner (continuous background) ─────────────────────────────────
# When enabled, the daemon periodically scans recent events (within
# window_secs), infers stable route shapes, and auto-pushes new routes to
# the DB + hot-reloads them. Requires Postgres storage.
[route_learner]
enabled = false           # set true to enable continuous learning
interval_secs = 300       # run a learning pass every N seconds (min 30)
window_secs = 3600        # look back at events from the last N seconds
min_hits = 10             # minimum hits for a shape to be considered stable
min_ips = 2               # minimum distinct IPs that hit the shape

# ── LLM (optional) ───────────────────────────────────────────────────────
# provider = "none" disables LLM entirely (default).
# OpenRouter routes to any model (Claude, GPT, Gemini, Qwen, Llama, …).
# Set SENTRY_LLM_KEY env var for the API key; never put it here.
[llm]
provider = "none"            # none | openrouter | openai | ollama | jev | mock
model = ""                   # default: openai/gpt-4o-mini (openrouter) | llama3.1 (ollama)
base_url = ""                # override for self-hosted (e.g. http://localhost:11434 for ollama)
                             # openai = any OpenAI-compatible server: LM Studio (default
                             # base_url http://localhost:1234/v1), vLLM, llama.cpp; keyless,
                             # SENTRY_LLM_KEY sent as bearer when set
                             # jev = TypeSafe calibrated classifier (structured probabilities,
                             # no prose); key from SENTRY_JEV_KEY (or TYPESAFE_API_KEY /
                             # JEV_API_KEY / ~/.config/typesafe/key), model default "jev-latest"
mode = "fork"                # fork (async re-score + action re-dispatch) | shadow (log only)
only_above = 30              # escalate to the LLM above this score (or on quarantine)
concurrency = 4
cache_ttl_secs = 300

# ── Rules engine ─────────────────────────────────────────────────────────
[rules]

# Default rule packs. mode = "shadow" (log only) | "enforce" (act) | "off".
# sensitive_paths ships in "enforce" by default — see ARCHITECTURE.md §10.3.1.
[[rules.pack]]
name = "vpn_proxy"
mode  = "shadow"

[[rules.pack]]
name = "tor"
mode  = "shadow"

[[rules.pack]]
name = "crawlers_bad"
mode  = "enforce"

[[rules.pack]]
name = "crawlers_good"
mode  = "enforce"

[[rules.pack]]
name = "sensitive_paths"
mode  = "enforce"

[[rules.pack]]
name = "empty_ua"
mode  = "shadow"

[[rules.pack]]
name = "http_anomaly"
mode  = "shadow"

[[rules.pack]]
name = "rate_scan"
mode  = "shadow"

[[rules.pack]]
name = "country_blocklist"
mode  = "off"
[rules.pack.params]
# countries = ["RU", "CN"]   # ISO 3166-1 alpha-2

# Broad honeypot bait from nginx-honeypot's honey.conf (F7.1): any `.aspx`,
# `cgi-bin`, `node_modules`, `/actuator/health`, any dotfile path. Deliberate
# bait on a decoy, but too generic to block on a real site — shadow default.
[[rules.pack]]
name = "honeypot_paths"
mode  = "shadow"

# Host allowlist (F7.1): requests whose Host header is not one of your
# domains (including Host-less requests — bare-IP scans) are blocked.
# Off by default; requires `params.domains`.
[[rules.pack]]
name = "host_allowlist"
mode  = "off"
[rules.pack.params]
# domains = ["example.com", "www.example.com"]

# Static inline rules (in addition to the DB-managed ones).
[[rules.custom]]
name = "allow internal monitoring"
priority = 1
match = 'ip=10.0.0.0/8'
action = "allow"

[[rules.custom]]
name = "challenge datacenter ASN outside business hours"
priority = 20
match = 'asn=14061 AND time outside(09:00-18:00 America/Sao_Paulo)'
action = "challenge"

# Reputation feeds (F3.7): public IP blocklists fetched periodically and
# attached to events as enrichment. tier = unknown | clean | suspicious |
# malicious | datacenter | vpn | tor | authorized | promiscuous. An optional
# `action` generates one enforcement rule per feed; without it the feed only
# enriches — match it via the `tor` / `vpn_proxy` packs (finally functional
# with a feed present) or `reputation = …` rules of your own. Feed URLs are
# untrusted input: http/https only, loopback/private/reserved hosts are
# rejected. Manage with `sentry feeds list | refresh | check <ip>`.
#
# [[rules.feeds]]
# name = "tor_exit"
# url  = "https://check.torproject.org/exit-addresses"
# tier = "tor"
# refresh_hours = 24
#
# [[rules.feeds]]
# name = "spamhaus_drop"
# url  = "https://www.spamhaus.org/drop/drop.txt"
# tier = "malicious"
# refresh_hours = 24
# action = "block"          # optional: one synthetic rule per feed
#
# [[rules.feeds]]
# name = "firehol_level1"   # aggregates Spamhaus DROP/eDROP, DShield, …
# url  = "https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset"
# tier = "malicious"
# refresh_hours = 24
#
# Scanner taxonomy (F3.10): `promiscuous` marks scanners that publish recon
# data anyone can query — each hit earns a small `promiscuous_scanner`
# signal (weight 10) because the data feeds attackers. `authorized` marks
# contracted scanners (your pentest vendor); it raises no signal — pair it
# with an `Allow` rule like `reputation = "authorized"` to trust them.
#
# [[rules.feeds]]
# name = "promiscuous_scanners"
# url  = "https://example.invalid/promiscuous-scanners.txt"
# tier = "promiscuous"
# refresh_hours = 24
#
# [[rules.feeds]]
# name = "authorized_scanners"
# url  = "https://example.invalid/authorized-scanners.txt"
# tier = "authorized"
# refresh_hours = 24
#
# Datasets (F7.6): `kind = "user_agent" | "path"` compiles a plain one-per-
# line list (https, SSRF-guarded) into one synthetic rule — entries are
# matched as case-insensitive literals. Unlike IP feeds there is no
# enrichment tier: `action` defaults to "log" (annotate only); set
# "block"/"challenge" to enforce. Disabled by default — nothing is shipped
# until you add a dataset. A background refresh updates the service copy;
# the rule itself is rebuilt on restart or rules hot-reload.
#
# [[rules.feeds]]
# name = "bad_bots_ultimate"
# kind = "user_agent"
# url  = "https://raw.githubusercontent.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker/master/_generator_lists/bad-user-agents.list"
# refresh_hours = 24
# action = "log"            # start in shadow; flip to "block" after auditing
#
# [[rules.feeds]]
# name = "probe_paths"
# kind = "path"
# url  = "https://example.invalid/probe-paths.txt"
# refresh_hours = 24
# action = "challenge"
#
# Authenticated feeds: `headers_env` maps header name → env var (values
# never live in the config file). Example: the AbuseIPDB blacklist
# (subscriber feature, plain-text with `plaintext=true`).
#
# [[rules.feeds]]
# name = "abuseipdb_blacklist"
# url  = "https://api.abuseipdb.com/api/v2/blacklist?confidenceMinimum=90&plaintext=true"
# tier = "malicious"
# refresh_hours = 24
# headers_env = { Key = "SENTRY_ABUSEIPDB_KEY" }
#
# enabled = true is the default; set enabled = false to pause a feed without
# removing it.

# Real client IP + trusted infrastructure (F7.2).
[real_ip]
# Peers allowed to set header-borne client IPs (CF-Connecting-IP,
# True-Client-IP, X-Real-IP, XFF). Headers from any other peer are ignored —
# a direct-to-origin client cannot spoof its IP with a forged header.
# trusted_proxies = ["10.0.0.0/8", "192.0.2.1"]
# Auto-include the Cloudflare ranges (bundled + refreshed daily from
# cloudflare.com/ips-v4|ips-v6). Default true.
# cloudflare = true
# The nginx-honeypot TRUSTED_IPS concept: clients never to ban, block or
# report (admins, uptime probes). They short-circuit the pipeline to Allow.
# trusted_ips = ["203.0.113.7", "2001:db8::1"]
# refresh_secs = 86400

# On-demand external IP reputation (F7.5): gray-band IPs — local score
# elevated but not yet acted on, or carrying a listed signal — are checked
# against AbuseIPDB and the confidence score re-enters the pipeline (it can
# only raise the verdict). Off by default; consumes API quota.
[ip_lookup]
enabled = false
provider = "abuseipdb"
key_env = "SENTRY_ABUSEIPDB_KEY"
trigger_above = 25          # local risk score band start
on_signals = []             # e.g. ["sensitive_path"] to widen the trigger
cache_ttl_secs = 86400
max_per_hour = 500          # quota guard (AbuseIPDB free tier: 1000/day)
timeout_secs = 10

# ── Sources ──────────────────────────────────────────────────────────────
[[source]]
type = "nginx"
[source.options]
path = "/var/log/nginx/access.log"
format = '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'

# Behind Cloudflare (or another reverse proxy) add the CDN's client-IP header
# to your nginx log_format AND to `format` below — the parser resolves the
# real client IP automatically when the header is present (falls back to
# $remote_addr for direct traffic, where nginx logs "-"):
#
# [[source]]
# type = "nginx"
# [source.options]
# path = "/var/log/nginx/access.log"
# format = '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_cf_connecting_ip"'
#
# Precedence: $http_cf_connecting_ip > $http_true_client_ip > $http_x_real_ip
#             > $http_x_forwarded_for (first of chain) > $remote_addr.
# Every captured $http_* token also becomes an event header (e.g.
# cf-connecting-ip), usable in DSL rules via `header.cf-connecting-ip = ...`.

# [[source]]
# type = "cloudflare"
# [source.options]
# zone = "example.com"
# poll_secs = 30

# Syslog receiver (RFC 5424 with RFC 3164 fallback) for firewalls, network
# equipment and services that ship logs via syslog. The peer address becomes
# the client IP; each message becomes a ProtocolData::Syslog event.
# TCP supports newline framing and RFC 6587 octet-counting.
# [[source]]
# type = "syslog"
# [source.options]
# bind = "0.0.0.0:5140"   # ports < 1024 need root; 5140 avoids that
# transport = "udp"       # udp | tcp

# ── Cloudflare logs pull (F3.3) ────────────────────────────────────────────# Polls the zone Logs API (`GET /zones/{id}/logs/received`, NDJSON) and feeds
# the same pipeline as the nginx tail. Requires an Enterprise entitlement for
# received logs; token via env (default SENTRY_CF_TOKEN, Logs:Read).
# [[source]]
# type = "cloudflare"
# [source.options]
# zone_id = "023e105f4ecef8ad9ca31a8372d0c353"
# poll_secs = 30                  # min 5
# start = "2026-09-30T00:00:00Z"  # first poll cursor (default: now)
# api_base = "https://api.cloudflare.com/client/v4"

# ── Passive TCP capture (F3.2) ─────────────────────────────────────────────
# Raw packet capture with SYN fingerprinting (masscan/zmap/nmap detection).
# Requires the build feature `pcap` (sentry-cli/pcap) AND elevated
# privileges at runtime: Npcap on Windows, CAP_NET_RAW on Linux.
# [[source]]
# type = "tcp"
# [source.options]
# interface = "eth0"    # capture interface (required)
# ports = "80,443,8443" # destination-port filter; empty = all
# payload_cap = 8192    # reassembled bytes kept per flow
# flow_cap = 65536      # max tracked flows (FIFO eviction)

# ── Web dashboard / JSON API (`sentry serve`) ──────────────────────────────
# Separate process from the daemon; requires Postgres.
[server]
host = "127.0.0.1"
port = 8080

# Auth + RBAC (F4.4). mode: none | password | token | both.
# Roles: admin = mutations (block/unblock/forgive/resolve/ack); viewer = read-only.
[server.auth]
mode = "none"                      # keep "none" only on loopback
# session_secret_env = "SENTRY_SESSION_SECRET"  # HMAC key for session cookies (32+ random bytes)
# session_ttl_secs = 43200         # 12h
#
# Dashboard login (password mode). Generate the hash:
#   sentry auth hash-password 'my-password'
# [[server.auth.users]]
# username = "admin"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."   # output of the command above
# role = "admin"
#
# Static API tokens (token mode). Hash a raw token with:
#   sentry auth token-hash 'my-raw-token'
# [[server.auth.tokens]]
# token_sha256 = "<64 hex chars>"   # or token_env = "SENTRY_DASH_TOKEN" (raw token)
# role = "viewer"

# ── Deployment mode (F3.9) ────────────────────────────────────────────────
# passive (default): read-only sources, act ex-post via actions.
# inline: sentry-edge reverse proxy in front of the app (WAF mode) —
# requires [edge] upstream + a healthy backend at startup.
[deployment]
mode = "passive"             # passive | inline
# instance_id = "node-1"     # metrics label for multi-node setups (F4.7)

# ── Inline edge (used when [deployment] mode = "inline") ──────────────────
# Chain: client → sentry-edge → nginx → app. The startup health check
# against the upstream is mandatory; verdicts apply BEFORE proxying
# (Block→403 · RateLimit→429 · Challenge→challenge page · Allow→proxy).
# Blocked IPs (blocklist action, dashboard/CLI, pipeline Block verdicts)
# are denied by a fast-path BEFORE the pipeline runs and stay blocked
# across restarts (blocks persist in ip_state, synced via NOTIFY
# sentry_blocks_changed — siblings enforce them too).
[edge]
listen = "0.0.0.0:80"
upstream = "http://127.0.0.1:8080"
health_path = "/"
health_timeout_secs = 5
body_capture_kb = 0          # request-body bytes kept for inspection (KiB)
# tls_cert = "/etc/sentry/edge.crt"   # requires build feature `edge-tls`
# tls_key = "/etc/sentry/edge.key"
# Inline TCP front for non-HTTP services (verdict on connect):
# tcp_listen = "0.0.0.0:2222"
# tcp_upstream = "127.0.0.1:22"

# Interactive JavaScript challenge for `Challenge` verdicts (F7.8) — the
# self-hosted "checking your browser": a SHA-256 proof-of-work page browsers
# solve in <1s; JS-less clients (curl, dumb bots) stay stuck on 503. rDNS-
# verified crawlers ([bot_verification]) bypass entirely. Stateless: share
# the secret across edge nodes. PoW never unlocks a hard Block.
[edge.challenge]
enabled = false
secret_env = "SENTRY_EDGE_CHALLENGE_SECRET"   # required when enabled (`openssl rand -hex 32`)
bucket_secs = 3600           # challenge/cookie rotation window
difficulty = 16              # PoW leading zero bits (clamped 8..=28)
title = "Verifying your browser..."

# ── Actions ──────────────────────────────────────────────────────────────
# blocklist: feeds the shared block table on Block verdicts; the daemon
# mirrors the same blocks to ip_state (dashboard-visible, restart-safe).
# This TTL governs pipeline blocks end to end.
[[action]]
type = "blocklist"
[action.options]
ttl_secs = 86400

[[action]]
type = "challenge"
provider = "cloudflare"        # cloudflare | aws_waf | fastly | ... (extensible via ChallengeProvider)
[action.options]
mode = "managed_challenge"     # block | js_challenge | managed_challenge | rate_limit
ttl_secs = 86400
max_failures = 3               # circuit breaker: disable the provider after N consecutive failed inserts (until restart)
# token: env SENTRY_CF_TOKEN
# zone:   env SENTRY_CF_ZONE
# Backward-compatible alias: `type = "cloudflare"` (no `provider`) is equivalent.

# IPv6 /64 edge blocking (F2.14). IP Access Rules accept exact addresses
# only, so an IPv6 host that rotates its interface ID inside its /64 slips
# through a /128 rule. With `ipv6_prefix = 64`, block/rate-limit verdicts for
# IPv6 clients are applied to their /64 network via a Cloudflare IP List
# (account-level, `sentry_blocks` by default) + one zone custom rule
# (`ip.src in $sentry_blocks`, action block). TTL is encoded per item
# (`sentry:<ts>:<ttl>` comment) and the reaper expires items across
# restarts. Challenges keep exact-address access rules; IPv4 is unchanged.
# Requires the extra token permissions Account → Filter Lists: Edit and
# Zone → Rulesets: Edit; without them list mode soft-disables (warning) and
# IPv6 blocks fall back to exact-address access rules.
# ipv6_prefix = 64             # 1..=128; absent/128 keeps exact-address rules
# list_name = "sentry_blocks"  # ^[a-z0-9_]+$, max 50 chars
# account:   env SENTRY_CF_ACCOUNT (optional — derived from the zone when unset)

# Local kernel-level ban (F7.3): bans are enforced by the machine's own
# firewall instead of (or next to) a CDN edge. Backends, auto-detected in
# this order: nftables (recommended — per-element timeouts, sub-ms bans),
# legacy ipset+iptables, firewalld runtime ipsets. Needs root or
# CAP_NET_ADMIN (systemd: AmbientCapabilities=CAP_NET_ADMIN) — see
# `sentry firewall status`. The DB (`ip_state`) is the source of truth:
# bans are re-seeded on restart and reconciled every 60s; `[real_ip]
# trusted_ips` are never banned. Linux only.
# [[action]]
# type = "challenge"
# provider = "firewall"
# [action.options]
# backend = "auto"             # auto | nftables | ipset | firewalld
# ttl_secs = 86400             # Block/Challenge ban duration
# rate_limit_ttl_secs = 600    # shorter TTL for RateLimit verdicts
# table = "sentry"             # nftables table name
# set_prefix = "sentry_blocks" # sets sentry_blocks_v4 / sentry_blocks_v6

# nginx config-generation provider (F7.8/F6.2): enforces verdicts on a
# co-located nginx by writing includes + reloading it. Works with Sentry in
# passive mode (the honeypot topology). Generates, under conf_dir:
#   sentry-deny.conf        deny <ip>; lines (Block verdicts)
#   sentry-challenge.conf   geo map $sentry_challenge_ip (Challenge verdicts)
#   sentry-challenge-if.conf include inside your server {} block — turns on
#                           the getpagespeed js_challenge module for mapped
#                           IPs (install nginx-module-js-challenge)
#   sentry-bots.conf        optional `bot_verifier on;` snippet (install
#                           nginx-module-bot-verifier + Redis)
# Denies reconcile with ip_state every 60s; reloads are debounced (≥1/s)
# and gated on `nginx -t`. The daemon needs write access to conf_dir and
# reload permission.
# [[action]]
# type = "challenge"
# provider = "nginx"
# [action.options]
# conf_dir = "/etc/nginx/conf.d/sentry"
# reload_cmd = "nginx -s reload"
# validate = true              # nginx -t before every reload
# ttl_secs = 86400
# rate_limit_deny = false      # also deny RateLimit verdicts
# provision_bots = true        # emit the bot_verifier snippet
# geo_var = "$sentry_challenge_ip"
# ipv6_prefix = 64             # IPv6 entries as CIDR (exact when absent)

# Community abuse reporting (F7.4): reports IPs that earn an enforcing
# verdict to AbuseIPDB or ReportedIP, with signal→category mapping and a
# per-IP dedupe window (one report per IP per TTL — mind the daily quotas).
# [[action]]
# type = "report"
# provider = "abuseipdb"       # abuseipdb | reportedip
# [action.options]
# key_env = "SENTRY_ABUSEIPDB_KEY"
# min_verdict = "block"        # block | challenge | rate_limit
# dedupe_hours = 24
# timeout_secs = 10

[[action]]
type = "webhook"
[action.options]
# Discord/Slack-style URLs are credentials: prefer url_env over a literal.
# Discord targets get a rich embed payload automatically; others receive the
# raw JSON payload.
# url_env = "SENTRY_DISCORD_WEBHOOK_URL"
url = "https://discord.com/api/webhooks/000000/xxxxx"
on_levels = ["high", "critical"]
timeout_secs = 10
# secret_env = "SENTRY_WEBHOOK_SECRET"  # when set, requests are signed with
# X-Sentry-Signature: sha256=<hmac>; payload carries incident_id so the
# receiver can call back POST /api/incidents/{id}/ack|resolve — the same
# secret authenticates those callbacks ([server] webhook_secret_env).

[[action]]
type = "log"