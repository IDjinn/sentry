# ── Actions ─────────────────────────────────────────────────────────────────
# `action <type> [provider] { … }`. Everything besides `dispatch` is passed to
# the action as an option; durations like `ttl: 24h` become `ttl_secs`.
action blocklist {
    dispatch: inline
    ttl: 24h
}

action challenge cloudflare {
    mode: managed_challenge         # block | js_challenge | managed_challenge | rate_limit
    ttl: 24h
    max_failures: 3
    # ipv6_prefix: 64
}

# action challenge firewall { backend: auto, ttl: 24h }
# action challenge nginx { conf_dir: /etc/nginx/conf.d/sentry, reload_cmd: "nginx -s reload" }
# action report abuseipdb { key_env: SENTRY_ABUSEIPDB_KEY, min_verdict: block }

action webhook {
    url_env: SENTRY_DISCORD_WEBHOOK_URL
    on_levels: [high, critical]
    timeout_secs: 10
}

action log {}

# ── Dashboard / JSON API (`sentry serve`) ───────────────────────────────────
dashboard {
    listen: 127.0.0.1:8080
    auth {
        mode: none                  # none | password | token | both
        # session_secret_env: SENTRY_SESSION_SECRET
        # session_ttl: 12h
        # user admin {
        #     password_hash: "$argon2id$v=19$…"     # sentry auth hash-password '…'
        #     role: admin
        # }
        # token {
        #     token_env: SENTRY_DASH_TOKEN
        #     role: viewer
        # }
    }
}

# ── Prometheus metrics + /api/events ────────────────────────────────────────
metrics {
    enabled: on
    listen: 0.0.0.0:9100
}

# ── Inline edge (used when sentry { mode: inline }) ─────────────────────────
# Chain: client → http {} → upstream. Verdicts apply BEFORE proxying
# (Block → 403 · RateLimit → 429 · Challenge → challenge page · Allow → proxy).
#
# The shortest form: everything to one backend.
#   http { proxy_pass: http://127.0.0.1:8080 }
http {
    listen: 0.0.0.0:80
    # tls { cert: /etc/sentry/edge.crt, key: /etc/sentry/edge.key, redirect_https: on }

    # A site per domain (exact, *.wildcard or ~regex; no host = catch-all).
    # Inside a site, `"/path": target` routes a path prefix:
    #   target = upstream name · URL · [URL, URL] (balanced) · status ["text"]
    #            · redirect [code] "url"
    site {
        "/": http://127.0.0.1:8080
    }

    # site example.com www.example.com {
    #     tls: /etc/sentry/example.crt /etc/sentry/example.key
    #
    #     "/": http://app:8080
    #     "/api/": [http://api-1:9000, http://api-2:9000]
    #     "/old-blog/": redirect "https://blog.example.com$request_uri"
    #
    #     # Need more than a target? Use a location block. Modifiers like
    #     # nginx: `=` exact, `^~` prefix that skips regexes, `~`/`~*` regex.
    #     location = /health { return: 200 ok, inspect: off }
    #     location ~* '\.(php|aspx?)$' { return: 403 }
    #
    #     location /admin/ {
    #         proxy_pass: http://app:8080
    #         allow: [10.0.0.0/8]              # anyone else → 403
    #         challenge: always
    #     }
    #
    #     location /api/ {
    #         match { query.version: "2" }     # failing match → next candidate
    #         proxy_pass: http://api-v2:9000/  # path in the URL replaces /api/
    #     }
    #
    #     location /static/ {
    #         proxy_pass: http://static:8080
    #         inspect: off                     # on | shadow | off
    #         response_headers { Cache-Control: "public, max-age=86400", Server: off }
    #     }
    #
    #     location /events { proxy_pass: http://app:8080, response_buffering: off }
    # }

    # Per-location (or per-site) extras, all optional:
    #   match { method: [GET, POST], query.NAME: v, header.NAME: present,
    #           cookie.NAME: ~ "re", ip: [10.0.0.0/8], host: … }
    #   rewrite: '^/v1/(.*)$' '/$1'
    #   request_headers { X-Tenant: acme, Cookie: off }   # off = remove
    #   response_headers { X-Frame-Options: DENY }
    #   timeout: 30s · response_buffering: off
    #   inspect: on | shadow | off · challenge: always · rate_limit: 100/1m
    #   allow: [cidr] · deny: [cidr] · policy { medium: allow }
    #   packs { sensitive_paths: off }

    # Named upstream when several locations share a balanced group:
    # upstream api {
    #     server: [http://api-1:9000, http://api-2:9000]
    #     balance: least_conn               # round_robin | least_conn | ip_hash
    #     health_path: /healthz
    # }

    # Tuning (defaults shown):
    # forwarded_headers: on · response_buffering: on · body_capture: 0
    # max_concurrent_requests: 1024 · upstream_timeout: 300s
    # upstream_connect_timeout: 5s · upstream_pool_idle: 32 · health_timeout: 5s
    # error_pages: /etc/sentry/pages         # 403.html, 429.html, 502.html …
    # compress { enabled: on, min_length: 256, level_br: 4, level_gzip: 6 }
    # TLS is 1.3-only by default; allow 1.2 explicitly:
    #   tls { cert: …, key: …, min_version: "1.2" }
    # Security headers are injected natively and ON by default (origin
    # headers win; "off" disables one). Defaults shown; coep is off because
    # require-corp breaks third-party embeds:
    # security_headers {
    #     hsts: "max-age=31536000"            # HTTPS only (TLS or X-Forwarded-Proto)
    #     csp: "base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
    #     x_frame_options: SAMEORIGIN
    #     x_content_type_options: nosniff
    #     referrer_policy: strict-origin-when-cross-origin
    #     permissions_policy: "camera=(self), microphone=(self), geolocation=(self), usb=()"
    #     x_xss_protection: "1; mode=block"
    #     coop: same-origin-allow-popups
    #     corp: same-site
    #     coep: off
    #     strip: [Server, X-Powered-By]
    #     override_origin: off
    # }
    # Email auth (SPF/DMARC/DKIM) is DNS, not HTTP: audit with `sentry posture`.
    # challenge { backend: sentry, enabled: off, secret_env: SENTRY_EDGE_CHALLENGE_SECRET }
    # socket { reuseport_workers: 1, backlog: 0, nodelay: on, keepalive: 60s }
}

# Inline TCP front for non-HTTP services (verdict on connect).
# tcp { listen: 0.0.0.0:2222, proxy_pass: 127.0.0.1:22 }
