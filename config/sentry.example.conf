# sentry.example.conf — example configuration for Sentry.
#
# Copy to `sentry.conf` and edit. Secrets go in env vars, not here.
#
# Syntax (nginx-like):
#   key: value                 one directive per line (`;` or `,` also separate)
#   key: v1 v2                 several values on one line (return: 301 "https://…")
#   name [label…] { … }        blocks; labels name or qualify them
#   [a, b, c]                  lists (commas optional, may span lines)
#   "text" / 'raw'             double quotes expand ${ENV_VAR} and ${VAR:-default};
#                              single quotes are taken literally (regex, DSL)
#   bare words                 identifiers, paths, URLs, 0.0.0.0:80 — no quotes needed
#   10s 5m 24h 7d · 4k 10mb    durations (plain numbers = seconds) · sizes
#   on/off, yes/no, true/false booleans
#   # … or // … or /* … */     comments
#   include: "conf.d/*.conf"   splice other files in place (relative to this file)
#
# A directive repeated in the same block accumulates (lists) — e.g. several
# `rewrite:` lines in one location.
#
# Env overlay still works on top of the file:
#   SENTRY_<SECTION>__<KEY>=value   e.g. SENTRY_STORAGE__POSTGRES__URL=postgres://…
#
# `sentry auto` writes `sentry.auto.conf` next to this file; it is merged on
# every load (routes and rules are appended, existing entries win).

# ── Instance ────────────────────────────────────────────────────────────────
sentry {
    # passive (default): read-only sources, act ex-post via actions.
    # inline: the `http {}` reverse proxy below sits in front of the app (WAF
    # mode) — requires at least one upstream and a healthy backend at startup.
    mode: passive
    # instance_id: node-1           # metrics label for multi-node setups

    # Tokio runtime tuning: empty = stock behavior (one worker per core).
    runtime {
        # worker_threads: 4
        # pin_cores: [0, 1]
        # priority: normal          # idle | below_normal | normal | above_normal | high
    }

    # Periodic version check (logs only) + defaults for `sentry update`.
    update {
        enabled: on
        interval: 24h               # min 5m (GitHub API rate limit)
        repo: IDjinn/sentry
        auto_restart: off
    }

    # Sensitive-file categories skipped by the `sentry auto` disk scan.
    # Categories: secrets, keys, cloud, data, ssh, dev, logs, config.
    auto {
        skip: []                    # e.g. [data] to scan dumps/archives again
        enable: []                  # e.g. [config] to also skip app config files
    }
}

# ── Detection engine ────────────────────────────────────────────────────────
server {
    data_directory: /var/lib/sentry
    channel_buffer: 4096            # source → daemon event channel
    action_buffer: 4096             # deferred action queue (sheds actions, never events)
    action_workers: 1               # 1 keeps strict action ordering
    persist_buffer: 2048            # batched INSERT lane
    dedupe_ttl: 10s                 # identical (ip, method, path) dropped inside the window

    # GeoLite2 databases; missing files make enrichment a graceful no-op.
    geo {
        city_db: /var/lib/sentry/GeoLite2-City.mmdb
        asn_db: /var/lib/sentry/GeoLite2-ASN.mmdb
    }

    # Verdict per risk level + DSL overrides evaluated before the mapping.
    policy {
        medium: rate_limit
        high: challenge
        critical: block

        # wp-admin only from the internal network:
        # override 'path ^/wp-admin$ AND NOT ip=10.0.0.0/8' {
        #     verdict: block
        # }
    }

    scorer {
        repetition_bonus: on
        repetition_window: 60s
        # weights {
        #     sql_injection: 35
        #     xss: 30
        #     random_scan: 25
        # }
    }

    # Repeat offenders: strikes climb the verdict ladder (never lower it).
    escalation {
        enabled: on
        window: 7d
        challenge_at: 3
        block_at: 5
        persist: on
    }

    # Measured pressure → telemetry degrades; detection/containment never do.
    overload {
        enabled: on
        queue_pressure: 0.8
        release_pressure: 0.5
        release: 30s
        pg_insert_budget: 250ms
        sample_keep: 0.1
        coalesce_benign: on
        coalesce_window: 60s
        coalesce_cap: 4096
    }
}

# ── Storage ─────────────────────────────────────────────────────────────────
storage {
    url: "${SENTRY_DATABASE_URL:-postgres://sentry:changeme@localhost:5432/sentry}"
    max_connections: 10
    # acquire_timeout: 5s
    # statement_timeout: 30s
}

# ── Detectors ───────────────────────────────────────────────────────────────
detect {
    # 4xx sweeps per IP: distinct paths → RandomScan, total → ScanBehavior.
    scan {
        enabled: on
        window: 60s
        distinct_paths: 8
        not_found: 10
    }

    # Auth brute force, credential stuffing, directory brute force.
    behavior {
        enabled: on
        window: 5m
        auth_failures: 10
        distinct_uas: 3
        wordlist_hits: 5
        suspicious_success_min_failures: 3
        # login_patterns: [login, signin, auth]
        # wordlist_paths: [/admin, /wp-admin]
    }

    # Scan from IP A → attack from IP B in the same /24, /64 or ASN.
    correlation {
        enabled: on
        window: 15m
    }

    # rDNS verification of UAs claiming to be Googlebot/bingbot/…
    bot_verification {
        enabled: off
        cache_ttl: 1h
        failed_ttl: 10m
        timeout: 2s
        batch_size: 16
    }

    # Request-body/upload inspection (inline edge only).
    uploads {
        enabled: off
        mode: shadow                # shadow | enforce
        inspect: 4mb
        max_files: 16
        scan_json: on
        oversize: reject            # reject | skip | flag
        blocked_extensions: [php, phtml, php5, jsp, jspx, asp, aspx, exe, dll, sh, bat, ps1]
        # allowed_extensions: [png, jpg, jpeg, gif, webp, pdf]
        # allowed_content_types: ["image/*", application/pdf]
        # methods: [POST, PUT, PATCH]
        # allowed_paths: [/wp-admin/, /api/upload]
        # allow_extensionless: on
        flood {
            window: 60s
            max_uploads: 30
            max_total: 50mb
        }
    }

    # Security-header advisories on origin responses (inline edge, never blocks).
    posture {
        enabled: on
        mode: shadow
        dedupe_ttl: 1h
        hsts_min_max_age: 31536000
        # checks: [csp, hsts, coop, clickjacking, trusted_types, nosniff, referrer_policy]
        # hosts: []
    }

    # Protocol schemas for non-standard ports (live-reloaded directory).
    protocol {
        enabled: off
        dir: schemas
        safety_poll: 60s
        debounce: 500ms
        max_schemas: 64
    }

    # Background route learner (needs storage).
    route_learner {
        enabled: off
        interval: 5m
        window: 1h
        min_hits: 10
        min_ips: 2
    }

    # Local ONNX model (build with --features sentry-cli/onnx).
    ai {
        enabled: off
        model_path: models/anomaly_v1.onnx
        threshold: 0.7
        signal_weight: 25
        mode: fork                  # fork | inline | shadow
        trigger: above_score        # above_score | always | quarantine_only
        min_score: 20
        concurrency: 4
        cache_ttl: 5m
    }

    # Optional LLM second opinion. Key via SENTRY_LLM_KEY.
    llm {
        provider: none              # none | openrouter | openai | ollama | jev | mock
        # model: openai/gpt-4o-mini
        # base_url: http://localhost:11434
        mode: fork                  # fork | shadow
        only_above: 30
        concurrency: 4
        cache_ttl: 5m
    }

    # On-demand AbuseIPDB lookups for gray-band IPs.
    ip_lookup {
        enabled: off
        provider: abuseipdb
        key_env: SENTRY_ABUSEIPDB_KEY
        trigger_above: 25
        on_signals: []
        cache_ttl: 24h
        max_per_hour: 500
        timeout: 10s
    }
}

# ── Client IP & trusted infrastructure ──────────────────────────────────────
trust {
    # Peers allowed to set CF-Connecting-IP / X-Real-IP / XFF.
    # proxies: [10.0.0.0/8, 192.0.2.1]
    cloudflare: on                  # auto-include Cloudflare ranges
    # trusted_ips: [203.0.113.7]    # never banned (pipeline Allow)
    # trusted_lists: [paypal, stripe, googlebot]
    # whitelist: [198.51.100.0/24]
    # blacklist: [192.0.2.66]       # denied before any detector runs
    # shadow: [198.18.0.0/15]       # analyzed, never banned
    refresh: 24h
}

# ── Rules ───────────────────────────────────────────────────────────────────
rules {
    # Default packs: shadow (log only) | enforce (act) | off.
    packs {
        vpn_proxy: shadow
        tor: shadow
        crawlers_bad: enforce
        crawlers_good: enforce
        sensitive_paths: enforce
        empty_ua: shadow
        http_anomaly: shadow
        rate_scan: shadow
        honeypot_paths: shadow
    }

    # Packs with parameters use the block form.
    pack country_blocklist {
        mode: off
        # countries: [RU, CN]
    }
    pack host_allowlist {
        mode: off
        # domains: [example.com, www.example.com]
    }

    # Static rules (in addition to the DB-managed ones).
    rule "allow internal monitoring" {
        priority: 1
        match: 'ip=10.0.0.0/8'
        action: allow
        log: silent                 # silent | info | warn | error
    }
    rule "challenge datacenter ASN outside business hours" {
        priority: 20
        match: 'asn=14061 AND time outside(09:00-18:00 America/Sao_Paulo)'
        action: challenge
    }

    # Curated blocklists by name: tor_exit, firehol_level1, proxy_list,
    # open_source_vpn_ips (they BLOCK by default).
    # feed_presets: [firehol_level1, tor_exit]

    # feed spamhaus_drop {
    #     url: https://www.spamhaus.org/drop/drop.txt
    #     tier: malicious
    #     refresh: 24h
    #     action: block
    # }
    # feed bad_bots {
    #     kind: user_agent
    #     url: https://example.invalid/bad-user-agents.list
    #     action: log
    # }
    # feed abuseipdb_blacklist {
    #     url: "https://api.abuseipdb.com/api/v2/blacklist?confidenceMinimum=90&plaintext=true"
    #     tier: malicious
    #     headers_env { Key: SENTRY_ABUSEIPDB_KEY }
    # }

    # Backend for rate conditions: memory (single node) | redis.
    rate_limit {
        backend: memory
        # redis_url: redis://127.0.0.1/
    }
}

# ── Known routes (route validator) ──────────────────────────────────────────
# path: methods. Globs (`/api/*`) and templates (`/users/{id}`) accept;
# `any` = every method. Requests outside the set raise UnknownRoute.
routes {
    "/": GET
    "/api/health": GET
    "/api/users/*": [GET, POST, PATCH, DELETE]
    "/static/*": GET
}

# ── Sources ─────────────────────────────────────────────────────────────────
source nginx {
    path: /var/log/nginx/access.log
    format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
}

