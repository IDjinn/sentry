# docker-compose.prod.yml — Sentry production override for aaPanel host.
#
# Usage:
#   docker compose -f deploy/docker/docker-compose.yml \
#                  -f deploy/docker/docker-compose.prod.yml up -d
#
# Differences from dev compose:
#   - sentry runs as root (to read /www/wwwlogs owned by www user, mode 700)
#   - postgres NOT exposed to host (no ports)
#   - mounts aaPanel nginx logs read-only
#   - mounts a real sentry.toml (gitignored) instead of the example
#   - restart: always

services:
  postgres:
    ports: !reset []

  sentry:
    user: "0:0"
    restart: always
    environment:
      RUST_LOG: info,sentry=info
      SENTRY_CF_TOKEN: "${SENTRY_CF_TOKEN:-}"
      SENTRY_CF_ZONE: "${SENTRY_CF_ZONE:-}"
      SENTRY_LLM_KEY: "${SENTRY_LLM_KEY:-}"
      SENTRY_STORAGE__POSTGRES__URL: "${SENTRY_STORAGE__POSTGRES__URL:-}"
    volumes:
      - ../../config/sentry.toml:/etc/sentry/sentry.toml:ro
      - /www/wwwlogs:/var/log/nginx:ro
      - sentrydata:/var/lib/sentry