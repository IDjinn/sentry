# ConfigMap — non-secret config for Sentry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentry-config
  namespace: sentry
data:
  sentry.conf: |
    server {
      data_directory: /var/lib/sentry
      channel_buffer: 4096
    }

    storage {
      url: "postgres://sentry@postgres.sentry.svc.cluster.local:5432/sentry"
      max_connections: 10
    }

    detect {
      llm { provider: none }
    }

    rules {
      packs {
        vpn_proxy: shadow
        tor: shadow
        crawlers_bad: enforce
        sensitive_paths: enforce
      }
    }

    source nginx {
      path: /var/log/nginx/access.log
    }
