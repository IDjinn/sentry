global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Sentry daemon metrics — host network namespace (port 9100).
  - job_name: sentry
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Host metrics (CPU, memory, disk, network).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
