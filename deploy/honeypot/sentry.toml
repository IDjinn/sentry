# sentry.toml — honeypot configuration for the public test VPS.
#
# Deployed at /opt/sentry/sentry.toml. The storage URL and session secret are
# injected via env (SENTRY_STORAGE__POSTGRES__URL / SENTRY_SESSION_SECRET).
# __ADMIN_PASSWORD_HASH__ is replaced at deploy time with the Argon2id hash of
# the generated dashboard password (`sentry auth hash-password`).

[core]
data_dir = "/var/lib/sentry"
channel_buffer = 4096

[storage.postgres]
url = ""                # overridden by SENTRY_STORAGE__POSTGRES__URL
max_connections = 5

# Geo is absent on this box: enrichment is a graceful no-op.

# ── Metrics (Prometheus) — daemon process, host network ────────────────────
# Bound to the docker bridge gateway only: scrapeable by the prometheus
# container (host-gateway) but not on the WAN interface — defense in depth
# on top of the Lightsail firewall (9100 is not opened to the internet).
[metrics]
enabled = true
host = "172.17.0.1"
port = 9100

[deployment]
mode = "inline"
instance_id = "honeypot-lightsail"

# ── Inline edge (F3.9) + TLS termination (F8) ──────────────────────────────
# Sentry owns the public listeners: 80 (plain) and 443 (TLS, feature
# `edge-tls` in the published image). Every request is scored by rules →
# heuristics → policy BEFORE the decoy answers, so e.g.
# /login?test=<script>… blocks on HTTPS exactly like on HTTP. What survives
# is proxied to the decoy nginx on loopback (compose: 127.0.0.1:8081).
[edge]
listen = "0.0.0.0:80"
upstream = "http://127.0.0.1:8081"
tls_listen = "0.0.0.0:443"
tls_cert = "/etc/sentry/certs/decoy.crt"
tls_key = "/etc/sentry/certs/decoy.key"
# The decoy is reached by raw IP (no SNI). An allowlist here would score
# every real visit as a TlsSniMismatch probe — keep it empty (disabled).
# tls_allowed_hosts = []
# tls_handshake_events defaults to true: one TlsHandshake event (SNI/JA3/
# JA4) per connection feeds the pipeline. tls_redirect_https stays off so
# port 80 keeps serving the decoy (honeypot = maximum surface) while still
# being scored and blocked.

# ── Behavioral detectors — all enabled (honeypot: everything is hostile) ───
[scan]
enabled = true
window_secs = 60
distinct_paths = 8
not_found = 10

[behavior]
enabled = true
window_secs = 300

[escalation]
enabled = true
window_secs = 604800
challenge_at = 3
block_at = 5
persist = true

[rate_limit]
backend = "memory"

# Real client IP + trusted infrastructure (F7.2). The decoy sits behind
# Cloudflare (orange cloud), so header-borne IPs are honored from the CF
# ranges (bundled + auto-refreshed); direct-to-origin spoofing of
# CF-Connecting-IP is ignored. Add your workstation / uptime-monitor IPs to
# trusted_ips — they can never be banned, blocked or reported.
[real_ip]
cloudflare = true
# trusted_ips = ["203.0.113.7"]

# ── Rules engine ───────────────────────────────────────────────────────────
[rules]

# Loopback hosts the rsyslog forwarder and AWS VPC infra (health checks,
# resolver) shows up on ens5 with private source IPs; firehol_level1 treats
# all private ranges as bogons, which would block them. Allow explicitly.
[[rules.custom]]
name = "allow private ranges (rsyslog + VPC infra)"
priority = 1
match = 'ip=127.0.0.0/8 OR ip=10.0.0.0/8 OR ip=172.16.0.0/12 OR ip=192.168.0.0/16 OR ip=169.254.0.0/16'
action = "allow"

# Enforce packs that map to real actions on this box (blocklist + firewall).
[[rules.pack]]
name = "sensitive_paths"
mode = "enforce"

# On a decoy every broad bait pattern is genuinely hostile (F7.1): an ASPX
# probe against a Rust/nginx box has no legitimate reader.
[[rules.pack]]
name = "honeypot_paths"
mode = "enforce"

[[rules.pack]]
name = "crawlers_bad"
mode = "enforce"

# crawlers_good must stay OFF on a honeypot: its allow list matches curl/8,
# Go-http-client and Puppeteer (meant for health checks in production), and
# an Allow short-circuits the pipeline before heuristics — every script-
# kiddie scan would sail through undetected.
[[rules.pack]]
name = "crawlers_good"
mode = "off"

[[rules.pack]]
name = "rate_scan"
mode = "enforce"

[[rules.pack]]
name = "http_anomaly"
mode = "enforce"

# Observation-only packs.
[[rules.pack]]
name = "empty_ua"
mode = "shadow"

[[rules.pack]]
name = "vpn_proxy"
mode = "shadow"

[[rules.pack]]
name = "tor"
mode = "shadow"

[[rules.pack]]
name = "country_blocklist"
mode = "off"

# Reputation feeds: exercise sentry-reputation + sentry_feed_* metrics.
# firehol_level1 gets an enforcement rule (block verdict → blocklist action).
[[rules.feeds]]
name = "tor_exit"
url = "https://check.torproject.org/exit-addresses"
tier = "tor"
refresh_hours = 24

[[rules.feeds]]
name = "firehol_level1"
url = "https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset"
tier = "malicious"
refresh_hours = 24
action = "block"

# ── Sources ────────────────────────────────────────────────────────────────
# The nginx access log is NOT a source anymore: in inline mode the edge
# already scores every request with the real client IP before the decoy
# sees it, while the decoy's log only ever shows the docker-proxy peer
# (a private IP, allow-listed by the first custom rule — useless as an
# event source and pure noise). The log stays in the `nginxlogs` volume
# for manual inspection, still rotated by the host cron.

# 1) Syslog receiver on host loopback: host rsyslog forwards auth failures.
#    NOTE: syslog events carry no HTTP payload, so only IP reputation applies
#    (and the peer IP is 127.0.0.1 — documented limitation).
[[source]]
type = "syslog"
[source.options]
bind = "127.0.0.1:5140"
transport = "udp"

# 2) Passive TCP capture with SYN fingerprinting (masscan/zmap/nmap).
#    Requires the `pcap` build feature + NET_RAW (granted in compose) and
#    host networking to see scans across all ports.
[[source]]
type = "tcp"
[source.options]
interface = "ens5"
ports = "21,22,23,25,80,110,135,139,443,445,1433,3306,3389,5432,5900,6379,8080,8443,27017"

# ── Known routes (the decoy site) — everything else is UnknownRoute ────────
[[routes.known]]
path = "/"
methods = ["GET"]

[[routes.known]]
path = "/robots.txt"
methods = ["GET"]

[[routes.known]]
path = "/admin*"
methods = ["GET", "POST"]

[[routes.known]]
path = "/login"
methods = ["GET", "POST"]

[[routes.known]]
path = "/static/*"
methods = ["GET"]

# ── Web dashboard (`sentry serve`, separate container) ─────────────────────
[server]
host = "127.0.0.1"      # overridden by SENTRY_SERVER__HOST in the container
port = 8080

[server.auth]
mode = "password"
session_secret_env = "SENTRY_SESSION_SECRET"
session_ttl_secs = 43200

[[server.auth.users]]
username = "admin"
password_hash = "__ADMIN_PASSWORD_HASH__"
role = "admin"

# ── Actions: local only (no Cloudflare on a raw honeypot) ──────────────────
[[action]]
type = "blocklist"
[action.options]
ttl_secs = 86400

# Kernel-level bans (F7.3): honeypot scanners are dropped by nftables
# before they reach anything. Backend auto-detects nftables → ipset →
# firewalld; the compose host grants the container NET_ADMIN or the
# systemd unit uses AmbientCapabilities=CAP_NET_ADMIN. `[real_ip]
# trusted_ips` (admin/uptime-probe IPs) are never banned.
[[action]]
type = "challenge"
provider = "firewall"
[action.options]
backend = "auto"
ttl_secs = 86400
rate_limit_ttl_secs = 600

# nginx includes (F7.8): alternative to (or beside) the firewall bans when
# the decoy nginx should serve the getpagespeed JS challenge to Challenge
# verdicts and deny Block verdicts in-config. Writes includes under the
# compose-mounted nginx conf dir and reloads with `nginx -t` gating; add
# `include /etc/nginx/conf.d/sentry/sentry-challenge-if.conf;` to the decoy
# server block.
# [[action]]
# type = "challenge"
# provider = "nginx"
# [action.options]
# conf_dir = "/etc/nginx/conf.d/sentry"
# reload_cmd = "nginx -s reload"
# validate = true
# ttl_secs = 86400

# Report the honeypot's catch to the community (F7.4): anything that earned
# a Block here gets reported to AbuseIPDB (key in the stack .env). One
# report per IP per day keeps the free tier's 1k/day quota safe. Categories
# map from the signals (scans → Port Scan, probes → Web App Attack, …).
# [[action]]
# type = "report"
# provider = "abuseipdb"
# [action.options]
# key_env = "SENTRY_ABUSEIPDB_KEY"
# min_verdict = "block"
# dedupe_hours = 24

# Discord alert on High/Critical incidents. The URL lives in the VPS .env
# (SENTRY_DISCORD_WEBHOOK_URL) — discord.com targets automatically get a
# rich embed payload.
[[action]]
type = "webhook"
[action.options]
url_env = "SENTRY_DISCORD_WEBHOOK_URL"
on_levels = ["high", "critical"]
timeout_secs = 10

[[action]]
type = "log"

# External IP reputation (F7.5): the decoy's catchers put most scanners in
# the gray band (sensitive path hit + 404 sweeps ≈ score 30-70, not yet
# ban-worthy on their own). Gray-band IPs get checked against AbuseIPDB and
# a high community confidence escalates them to Block. Enable when an API
# key is configured in the stack .env.
# [ip_lookup]
# enabled = true
# provider = "abuseipdb"
# key_env = "SENTRY_ABUSEIPDB_KEY"
# trigger_above = 25
# on_signals = ["sensitive_path", "directory_brute_force"]
# max_per_hour = 500

# ── LLM (TypeSafe jev — calibrated judgment API, no local compute) ─────────
# provider "jev" = structured probabilistic classification (see
# JEV_EVALUATION.md). The API key never lives in this file: it comes from
# SENTRY_JEV_KEY in the stack .env. fork = async re-score that can escalate
# verdicts; events above `only_above` are sent. When the API is unreachable
# the fork logs warnings and the pipeline proceeds unaffected.
[llm]
provider = "jev"
mode = "fork"
only_above = 30
concurrency = 2
cache_ttl_secs = 600
