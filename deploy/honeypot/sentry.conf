# sentry.conf — honeypot configuration for the public test VPS.
#
# Deployed at /opt/sentry/sentry.conf. The storage URL and session secret are
# injected via env (SENTRY_STORAGE__POSTGRES__URL / SENTRY_SESSION_SECRET).
# __ADMIN_PASSWORD_HASH__ is replaced at deploy time with the Argon2id hash of
# the generated dashboard password (`sentry auth hash-password`).

sentry {
    mode: inline
    instance_id: honeypot-lightsail
}

server {
    data_directory: /var/lib/sentry
    channel_buffer: 4096
    # Geo is absent on this box: enrichment is a graceful no-op.

    escalation {
        enabled: on
        window: 7d
        challenge_at: 3
        block_at: 5
        persist: on
    }
}

storage {
    url: ""                     # overridden by SENTRY_STORAGE__POSTGRES__URL
    max_connections: 5
}

# Metrics (Prometheus) — daemon process, host network. Bound to the docker
# bridge gateway only: scrapeable by the prometheus container (host-gateway)
# but not on the WAN interface — defense in depth on top of the Lightsail
# firewall (9100 is not opened to the internet).
metrics {
    enabled: on
    listen: 172.17.0.1:9100
}

# Behavioral detectors — all enabled (honeypot: everything is hostile).
detect {
    scan {
        enabled: on
        window: 60s
        distinct_paths: 8
        not_found: 10
    }
    behavior {
        enabled: on
        window: 5m
    }

    # External IP reputation (F7.5): the decoy's catchers put most scanners
    # in the gray band (sensitive path hit + 404 sweeps ≈ score 30-70).
    # Gray-band IPs get checked against AbuseIPDB and a high community
    # confidence escalates them to Block. Enable when an API key is set in
    # the stack .env.
    # ip_lookup {
    #     enabled: on
    #     provider: abuseipdb
    #     key_env: SENTRY_ABUSEIPDB_KEY
    #     trigger_above: 25
    #     on_signals: [sensitive_path, directory_brute_force]
    #     max_per_hour: 500
    # }

    # LLM (TypeSafe jev — calibrated judgment API, no local compute). The
    # API key comes from SENTRY_JEV_KEY in the stack .env. fork = async
    # re-score that can escalate verdicts; when the API is unreachable the
    # fork logs warnings and the pipeline proceeds unaffected.
    llm {
        provider: jev
        mode: fork
        only_above: 30
        concurrency: 2
        cache_ttl: 10m
    }
}

# Real client IP + trusted infrastructure (F7.2). The decoy sits behind
# Cloudflare (orange cloud), so header-borne IPs are honored from the CF
# ranges; direct-to-origin spoofing of CF-Connecting-IP is ignored. Add your
# workstation / uptime-monitor IPs to trusted_ips — never banned.
trust {
    cloudflare: on
    # trusted_ips: [203.0.113.7]
}

rules {
    # Loopback hosts the rsyslog forwarder and AWS VPC infra (health checks,
    # resolver) shows up on ens5 with private source IPs; firehol_level1
    # treats all private ranges as bogons, which would block them.
    rule "allow private ranges (rsyslog + VPC infra)" {
        priority: 1
        match: 'ip=127.0.0.0/8 OR ip=10.0.0.0/8 OR ip=172.16.0.0/12 OR ip=192.168.0.0/16 OR ip=169.254.0.0/16'
        action: allow
    }

    packs {
        # Enforce packs that map to real actions on this box.
        sensitive_paths: enforce
        # On a decoy every broad bait pattern is genuinely hostile (F7.1).
        honeypot_paths: enforce
        crawlers_bad: enforce
        # crawlers_good must stay OFF on a honeypot: its allow list matches
        # curl/8, Go-http-client and Puppeteer, and an Allow short-circuits
        # the pipeline before heuristics.
        crawlers_good: off
        rate_scan: enforce
        http_anomaly: enforce
        # Observation-only packs.
        empty_ua: shadow
        vpn_proxy: shadow
        tor: shadow
        country_blocklist: off
    }

    # Reputation feeds: firehol_level1 gets an enforcement rule.
    feed tor_exit {
        url: https://check.torproject.org/exit-addresses
        tier: tor
    }
    feed firehol_level1 {
        url: https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset
        tier: malicious
        action: block
    }

    rate_limit { backend: memory }
}

# Known routes (the decoy site) — everything else is UnknownRoute.
routes {
    "/": GET
    "/robots.txt": GET
    "/admin*": [GET, POST]
    "/login": [GET, POST]
    "/static/*": GET
}

# Sources. The nginx access log is NOT a source: in inline mode the edge
# already scores every request with the real client IP before the decoy sees
# it, while the decoy's log only shows the docker-proxy peer.

# 1) Syslog receiver on host loopback: host rsyslog forwards auth failures
#    (no HTTP payload — only IP reputation applies; peer IP is 127.0.0.1).
source syslog {
    bind: 127.0.0.1:5140
    transport: udp
}

# 2) Passive TCP capture with SYN fingerprinting (masscan/zmap/nmap).
#    Requires the `pcap` build feature + NET_RAW and host networking.
source tcp {
    interface: ens5
    ports: "21,22,23,25,80,110,135,139,443,445,1433,3306,3389,5432,5900,6379,8080,8443,27017"
}

# Web dashboard (`sentry serve`, separate container).
dashboard {
    listen: 127.0.0.1:8080      # host overridden by SENTRY_SERVER__HOST in the container
    auth {
        mode: password
        session_secret_env: SENTRY_SESSION_SECRET
        session_ttl: 12h
        user admin {
            password_hash: "__ADMIN_PASSWORD_HASH__"
            role: admin
        }
    }
}

# Actions: local only (no Cloudflare on a raw honeypot).
action blocklist {
    ttl: 24h
}

# Kernel-level bans (F7.3): scanners are dropped by nftables before they
# reach anything (NET_ADMIN granted in compose). trust › trusted_ips are
# never banned.
action challenge firewall {
    backend: auto
    ttl: 24h
    rate_limit_ttl_secs: 600
}

# nginx includes (F7.8): serve the getpagespeed JS challenge from the decoy
# nginx; add `include /etc/nginx/conf.d/sentry/sentry-challenge-if.conf;` to
# the decoy server block.
# action challenge nginx {
#     conf_dir: /etc/nginx/conf.d/sentry
#     reload_cmd: "nginx -s reload"
#     validate: on
#     ttl: 24h
# }

# Community reporting (F7.4): one report per IP per day keeps the free
# tier's quota safe.
# action report abuseipdb {
#     key_env: SENTRY_ABUSEIPDB_KEY
#     min_verdict: block
#     dedupe_hours: 24
# }

# Discord alert on High/Critical incidents (URL in the VPS .env).
action webhook {
    url_env: SENTRY_DISCORD_WEBHOOK_URL
    on_levels: [high, critical]
    timeout_secs: 10
}

action log {}

# Inline edge (F3.9) + TLS termination (F8): Sentry owns 80 and 443. Every
# request is scored BEFORE the decoy answers; what survives is proxied to the
# decoy nginx on loopback (compose: 127.0.0.1:8081).
http {
    listen: 0.0.0.0:80
    tls {
        listen: 0.0.0.0:443
        cert: /etc/sentry/certs/decoy.crt
        key: /etc/sentry/certs/decoy.key
        # The decoy is reached by raw IP (no SNI): an allowed_hosts list
        # would score every real visit as a TlsSniMismatch probe. redirect_https
        # stays off so port 80 keeps serving the decoy (maximum surface).
    }

    proxy_pass: http://127.0.0.1:8081
}
