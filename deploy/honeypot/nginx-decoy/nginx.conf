# nginx.conf — decoy web server for the Sentry honeypot.
# Plain-HTTP upstream only: the sentry edge terminates TLS on 443 (F8) and
# fronts this server on both public ports (compose: 127.0.0.1:8081:80).
# Logs go to a named volume for manual inspection / host logrotate — the
# edge is the detection surface, not this log.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # "combined" (nginx's built-in format): kept for consistency with the
    # reference log_format and easy diffing against other decoys.
    log_format decoy '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log decoy buffer=32k flush=1s;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    client_max_body_size 1m;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Bait for scanners: "there is an admin area here".
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /admin\nDisallow: /wp-admin\nDisallow: /login\n";
        }

        # Juicy paths serve the (fake) login page with 200; everything else
        # falls through to 404, feeding the scan/wordlist detectors.
        location ~* ^/(admin|wp-admin|wp-login\.php|phpmyadmin|pma|administrator|login|panel|manager|console)(/|$) {
            try_files /admin.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
