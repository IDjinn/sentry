# nginx.conf — decoy web server for the Sentry honeypot.
# Logs go to a named volume shared (read-only) with the sentry daemon, which
# tails access.log in combined format.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Must match the `format` in sentry.toml. ("combined" is nginx's built-in
    # format with exactly these fields — redefining it is a config error.)
    # Trailing $http_x_forwarded_for: any http_* token in the format becomes a
    # request header for the Sentry nginx parser, whose real-IP precedence
    # picks XFF over $remote_addr (ARCHITECTURE.md §8.1) — lets tests and
    # CDN-fronted deployments attribute events to the true client.
    log_format decoy '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log decoy buffer=32k flush=1s;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    client_max_body_size 1m;
    server_tokens off;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/decoy.crt;
        ssl_certificate_key /etc/nginx/certs/decoy.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        # Bait for scanners: "there is an admin area here".
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /admin\nDisallow: /wp-admin\nDisallow: /login\n";
        }

        # Juicy paths serve the (fake) login page with 200; everything else
        # falls through to 404, feeding the scan/wordlist detectors.
        location ~* ^/(admin|wp-admin|wp-login\.php|phpmyadmin|pma|administrator|login|panel|manager|console)(/|$) {
            try_files /admin.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
