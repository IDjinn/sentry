# /etc/rsyslog.d/30-sentry-syslog.conf — forward auth events to the Sentry
# syslog receiver (UDP, loopback only).
#
# LIMITATION: the syslog source carries no HTTP payload, so Sentry scores
# these events via IP reputation only, and the client IP is the forwarding
# peer (127.0.0.1). This exists to exercise the syslog source, not to detect
# SSH brute force.
auth,authpriv.* @127.0.0.1:5140
